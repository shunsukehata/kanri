name: Java Maven Test with MySQL

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'aws-corretto'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: ./

      - name: Test with Maven
        run: mvn verify
        working-directory: ./